<body>
<div class="app">
<aside class="sidebar">
 <div class="brand"><div class="logo">T</div><div><strong>TeamFlow</strong><small>팀 일정 관리 워크스페이스</small></div></div>
 <div><div class="side-caption">WORKSPACE</div><button class="nav-btn active" id="navCalendar">▦ &nbsp; 전체 일정</button><button class="nav-btn" id="navToday">◷ &nbsp; 오늘 일정</button></div>
 <div><div class="side-caption">TEAM FILTER</div><div id="teamFilters"></div><button class="btn ghost" id="selectAll" style="width:100%;justify-content:flex-start;font-size:12px;margin-top:8px">↻ 전체 팀 표시</button></div>
 <div class="side-bottom"><div class="side-note"><strong>ℹ 데이터 저장 안내</strong>일정은 현재 브라우저에 저장됩니다. 다른 구성원과 동기화하려면 서버 연동이 필요합니다. JSON 파일로 일정을 전달할 수 있습니다.</div><button class="btn" id="manageTeams" style="width:100%;margin-top:14px">⚙ 팀 관리</button></div>
</aside>
<main class="main">
 <header class="topbar"><div class="heading"><h1>팀별 공유 달력 <span aria-hidden="true">✦</span></h1><p>우리 팀의 일정을 한눈에 확인하고 관리하세요.</p></div><div class="top-actions"><button class="btn secondary-action" id="exportBtn">⇩ 내보내기</button><button class="btn secondary-action" id="importBtn">⇧ 가져오기</button><button class="btn primary" id="addBtn">＋ 일정 등록</button></div></header>
 <div class="mobile-team"><select id="mobileTeam"><option value="all">전체 팀 보기</option></select></div>
 <div class="toolbar"><div class="tool-left"><div class="nav-month"><button class="btn icon" id="prevMonth" aria-label="이전 달">‹</button><span class="month-title" id="monthLabel"></span><button class="btn icon" id="nextMonth" aria-label="다음 달">›</button></div><button class="btn" id="todayBtn">오늘</button></div><div class="top-actions tool-right"><div class="search-wrap"><svg width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="m16 16 5 5"/></svg><input class="search" id="search" placeholder="일정 검색" aria-label="일정 검색"></div><div class="segmented" role="group" aria-label="보기 방식"><button id="monthView" class="selected">월간</button><button id="listView">목록</button></div></div></div>
 <section class="calendar-shell month-mode" id="calendarSection"><div class="weekdays"><div class="weekday">일</div><div class="weekday">월</div><div class="weekday">화</div><div class="weekday">수</div><div class="weekday">목</div><div class="weekday">금</div><div class="weekday">토</div></div><div class="calendar-grid" id="calendarGrid"></div></section>
 <section class="calendar-shell list-only" id="listSection"><div class="list-head"><strong id="listHeading">일정 목록</strong><span id="listCount"></span></div><div class="full-agenda" id="fullAgenda"></div></section>
 <section class="bottom-layout"><div class="panel"><div class="panel-title"><h2 id="agendaHeading">선택한 날짜의 일정</h2><button class="btn ghost" id="addSelected" style="padding:5px 8px;color:#5265dd">＋ 추가</button></div><div class="agenda" id="dayAgenda"></div></div><div class="panel"><div class="panel-title"><h2>이달의 일정 현황</h2><span class="muted" id="monthStatsLabel"></span></div><div class="stats"><div class="stat"><b id="eventCount">0</b><span>표시 중인 일정</span></div><div class="stat"><b id="activeTeamCount">0</b><span>일정이 있는 팀</span></div></div><div class="legend" id="legend"></div></div></section>
 <p class="footnote">TeamFlow · 로컬 브라우저 기반 일정 관리 · 실시간 공유 및 권한 기능은 별도 백엔드 연동 필요</p>
</main></div>
<input type="file" id="fileInput" accept="application/json,.json" hidden>
<div id="modalRoot"></div><div id="toast" class="toast hidden" role="status" aria-live="polite"></div>
<script>
(()=>{'use strict';
const KEY='teamflow-calendar-v1';const colors=['#5265dd','#e78b55','#39a58e','#ae78ca','#df6d91','#5b9bcb','#9b9e51','#9b7d6c'];
const $=id=>document.getElementById(id);const pad=n=>String(n).padStart(2,'0');const fmt=d=>`${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;const parseDate=s=>new Date(s+'T12:00:00');const safe=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const id=()=>globalThis.crypto?.randomUUID?.()||String(Date.now())+'-'+Math.random().toString(36).slice(2);
const seedTeams=[{id:'planning',name:'기획팀',color:colors[0]},{id:'education',name:'교육운영팀',color:colors[1]},{id:'tech',name:'디지털지원팀',color:colors[2]},{id:'admin',name:'행정지원팀',color:colors[3]}];
function initial(){const t=new Date();const y=t.getFullYear(),m=t.getMonth();const date=d=>fmt(new Date(y,m,d,12));return {teams:seedTeams,events:[{id:id(),title:'월간 업무 공유회의',teamId:'planning',start:date(5),end:date(5),time:'10:00',desc:'팀별 진행 상황 및 주요 일정 공유'},{id:id(),title:'교육과정 운영 점검',teamId:'education',start:date(10),end:date(10),time:'14:00',desc:''},{id:id(),title:'업무 시스템 정기 점검',teamId:'tech',start:date(13),end:date(13),time:'09:30',desc:''},{id:id(),title:'예산 집행 현황 검토',teamId:'admin',start:date(18),end:date(18),time:'11:00',desc:''},{id:id(),title:'분기 협업 프로젝트',teamId:'planning',start:date(20),end:date(22),time:'',desc:'시범 일정입니다. 자유롭게 수정하거나 삭제할 수 있습니다.'}]};}
function validateData(d){if(!d||!Array.isArray(d.teams)||!Array.isArray(d.events))throw Error('올바른 TeamFlow 파일이 아닙니다.');if(d.teams.length>100||d.events.length>10000)throw Error('파일의 데이터 수가 너무 많습니다.');const ts=d.teams.map(t=>({id:String(t.id).slice(0,100),name:String(t.name).slice(0,60),color:/^#[0-9a-fA-F]{6}$/.test(t.color)?t.color:colors[0]})).filter(t=>t.id&&t.name);const ids=new Set(ts.map(t=>t.id));const dateOK=s=>/^\d{4}-\d{2}-\d{2}$/.test(s)&&!Number.isNaN(parseDate(s).getTime())&&fmt(parseDate(s))===s;const es=d.events.map(e=>({id:String(e.id||id()).slice(0,100),title:String(e.title||'').slice(0,150),teamId:String(e.teamId||''),start:String(e.start||''),end:String(e.end||''),time:/^([01]\d|2[0-3]):[0-5]\d$/.test(e.time)?e.time:'',desc:String(e.desc||'').slice(0,2000)})).filter(e=>e.title&&ids.has(e.teamId)&&dateOK(e.start)&&dateOK(e.end)&&e.start<=e.end);return {teams:ts,events:es};}
let data;try{const raw=localStorage.getItem(KEY);data=raw?validateData(JSON.parse(raw)):initial()}catch{data=initial()}let month=new Date();month=new Date(month.getFullYear(),month.getMonth(),1);let selected=fmt(new Date());let selectedTeams=new Set(data.teams.map(t=>t.id));let search='';let view='month';let toastTimer;
function persist(){try{localStorage.setItem(KEY,JSON.stringify(data))}catch{notify('브라우저 저장 공간을 확인해주세요.')}}function notify(msg){const el=$('toast');el.textContent=msg;el.classList.remove('hidden');clearTimeout(toastTimer);toastTimer=setTimeout(()=>el.classList.add('hidden'),3200)}function team(id){return data.teams.find(t=>t.id===id)}function visible(e){return selectedTeams.has(e.teamId)&&(!search||(e.title+' '+e.desc+' '+(team(e.teamId)?.name||'')).toLocaleLowerCase().includes(search))}function onDay(e,day){return e.start<=day&&e.end>=day}function dayEvents(day){return data.events.filter(e=>visible(e)&&onDay(e,day)).sort((a,b)=>(a.time||'99:99').localeCompare(b.time||'99:99')||a.title.localeCompare(b.title))}function monthEvents(){const start=fmt(new Date(month.getFullYear(),month.getMonth(),1)),end=fmt(new Date(month.getFullYear(),month.getMonth()+1,0));return data.events.filter(e=>visible(e)&&e.start<=end&&e.end>=start)}function teamTag(t){if(!t)return '';return `<span class="tag" style="color:${t.color};background:${t.color}18">${safe(t.name)}</span>`}function renderFilters(){const counts=Object.fromEntries(data.teams.map(t=>[t.id,monthEventsAll(t.id)]));$('teamFilters').innerHTML=data.teams.map(t=>`<label class="team-item"><input type="checkbox" data-team="${safe(t.id)}" ${selectedTeams.has(t.id)?'checked':''}><span class="dot" style="background:${t.color}"></span><span class="team-name">${safe(t.name)}</span><span class="team-count">${counts[t.id]}</span></label>`).join('');const s=$('mobileTeam'),current=s.value;s.innerHTML='<option value="all">전체 팀 보기</option>'+data.teams.map(t=>`<option value="${safe(t.id)}">${safe(t.name)}</option>`).join('');s.value=selectedTeams.size===data.teams.length?'all':selectedTeams.size===1?[...selectedTeams][0]:'all';$('legend').innerHTML=data.teams.filter(t=>selectedTeams.has(t.id)).map(t=>`<span class="legend-item"><span class="dot" style="background:${t.color}"></span>${safe(t.name)}</span>`).join('')||'<span class="muted">선택한 팀 없음</span>'}function monthEventsAll(tid){const start=fmt(new Date(month.getFullYear(),month.getMonth(),1)),end=fmt(new Date(month.getFullYear(),month.getMonth()+1,0));return data.events.filter(e=>e.teamId===tid&&e.start<=end&&e.end>=start).length}
function renderCalendar(){const first=new Date(month.getFullYear(),month.getMonth(),1),start=new Date(first);start.setDate(start.getDate()-start.getDay());const rows=Math.ceil((first.getDay()+new Date(month.getFullYear(),month.getMonth()+1,0).getDate())/7);let html='';for(let i=0;i<rows*7;i++){const d=new Date(start);d.setDate(start.getDate()+i);const day=fmt(d),events=dayEvents(day),outside=d.getMonth()!==month.getMonth(),today=day===fmt(new Date());html+=`<div class="day ${outside?'outside':''} ${today?'today':''} ${day===selected?'selected':''}" data-day="${day}" tabindex="0" role="button" aria-label="${day}, 일정 ${events.length}개"><span class="date-number">${d.getDate()}</span>${events.slice(0,3).map(e=>{const t=team(e.teamId);return `<button class="event-chip" data-event="${safe(e.id)}" title="${safe(e.title)}" style="background:${t?.color||'#999'}19;color:${t?.color||'#666'};border-left:3px solid ${t?.color||'#999'}">${e.time?safe(e.time)+' ':''}${safe(e.title)}</button>`}).join('')}${events.length>3?`<span class="more">+ ${events.length-3}개 더보기</span>`:''}</div>`} $('calendarGrid').innerHTML=html}
function agendaItem(e,showDate=false){const t=team(e.teamId);return `<button class="agenda-item" data-event="${safe(e.id)}"><span class="event-bar" style="background:${t?.color||'#999'}"></span><span class="agenda-content"><div class="agenda-title">${safe(e.title)}</div><div class="agenda-meta">${showDate?safe(e.start)+(e.start!==e.end?' ~ '+safe(e.end):'')+' · ':''}${e.time?safe(e.time)+' · ':''}${safe(t?.name||'삭제된 팀')}</div></span>${teamTag(t)}</button>`}
function renderAgenda(){const es=dayEvents(selected);$('agendaHeading').textContent=`${selected.replace(/-/g,'.')} 일정`;$('dayAgenda').innerHTML=es.length?es.map(e=>agendaItem(e)).join(''):'<div class="empty">이 날짜에는 등록된 일정이 없습니다.<br>+ 추가 버튼으로 일정을 만들어보세요.</div>'}
function renderList(){const es=monthEvents().sort((a,b)=>a.start.localeCompare(b.start)||(a.time||'99:99').localeCompare(b.time));$('listHeading').textContent=`${month.getFullYear()}년 ${month.getMonth()+1}월 일정`;$('listCount').textContent=`총 ${es.length}개`;let prior='';$('fullAgenda').innerHTML=es.length?es.map(e=>{const hd=prior===e.start?'':`<div class="list-date">${safe(e.start)} (${['일','월','화','수','목','금','토'][parseDate(e.start).getDay()]})</div>`;prior=e.start;return hd+agendaItem(e,true)}).join(''):'<div class="empty">조건에 맞는 일정이 없습니다.</div>'}
function renderStats(){const es=monthEvents();$('monthStatsLabel').textContent=`${month.getMonth()+1}월 기준`;$('eventCount').textContent=es.length;$('activeTeamCount').textContent=new Set(es.map(e=>e.teamId)).size}function render(){ $('monthLabel').textContent=`${month.getFullYear()}년 ${month.getMonth()+1}월`;renderFilters();renderCalendar();renderAgenda();renderList();renderStats();$('calendarSection').classList.toggle('hidden',view!=='month');$('listSection').classList.toggle('active',view==='list');$('monthView').classList.toggle('selected',view==='month');$('listView').classList.toggle('selected',view==='list')}
function closeModal(){$('modalRoot').innerHTML=''}function modal(inner){$('modalRoot').innerHTML=`<div class="modal-backdrop" id="backdrop"><div class="modal" role="dialog" aria-modal="true" aria-labelledby="modalTitle">${inner}</div></div>`;const back=$('backdrop');back.addEventListener('click',e=>{if(e.target===back)closeModal()});$('modalClose').addEventListener('click',closeModal);$('modalRoot').querySelector('input,select,textarea,button')?.focus()}
function openEvent(eid=null,day=selected){const e=eid?data.events.find(x=>x.id===eid):null;if(eid&&!e){notify('일정을 찾을 수 없습니다.');return}if(!data.teams.length){notify('먼저 팀을 생성해주세요.');openTeams();return}const base=e||{title:'',teamId:[...selectedTeams][0]||data.teams[0].id,start:day,end:day,time:'',desc:''};modal(`<div class="modal-header"><h2 id="modalTitle">${e?'일정 수정':'새 일정 등록'}</h2><button class="close" id="modalClose" aria-label="닫기">×</button></div><form class="form-content" id="eventForm"><div class="field"><label for="eventTitle">일정 제목 *</label><input id="eventTitle" maxlength="150" required placeholder="예: 주간 업무회의" value="${safe(base.title)}"></div><div class="field"><label for="eventTeam">담당 팀 *</label><select id="eventTeam">${data.teams.map(t=>`<option value="${safe(t.id)}" ${t.id===base.teamId?'selected':''}>${safe(t.name)}</option>`).join('')}</select></div><div class="form-grid"><div class="field"><label for="eventStart">시작일 *</label><input id="eventStart" type="date" required value="${safe(base.start)}"></div><div class="field"><label for="eventEnd">종료일 *</label><input id="eventEnd" type="date" required value="${safe(base.end)}"></div></div><div class="field"><label for="eventTime">시작 시간 (선택)</label><input id="eventTime" type="time" value="${safe(base.time)}"></div><div class="field"><label for="eventDesc">메모</label><textarea id="eventDesc" maxlength="2000" placeholder="장소, 준비 사항 등을 입력하세요">${safe(base.desc)}</textarea></div><div class="form-actions">${e?'<button type="button" class="btn danger" id="deleteEvent">삭제</button>':''}<div class="form-actions-right"><button type="button" class="btn" id="cancelEvent">취소</button><button type="submit" class="btn primary">${e?'변경 저장':'일정 등록'}</button></div></div></form>`);$('cancelEvent').onclick=closeModal;if(e)$('deleteEvent').onclick=()=>{if(confirm('이 일정을 삭제하시겠습니까?')){data.events=data.events.filter(x=>x.id!==e.id);persist();closeModal();render();notify('일정을 삭제했습니다.')}};$('eventForm').onsubmit=ev=>{ev.preventDefault();const title=$('eventTitle').value.trim(),start=$('eventStart').value,end=$('eventEnd').value;if(!title)return notify('일정 제목을 입력하세요.');if(start>end)return notify('종료일은 시작일보다 빠를 수 없습니다.');const obj={id:e?.id||id(),title,teamId:$('eventTeam').value,start,end,time:$('eventTime').value,desc:$('eventDesc').value.trim()};if(e)Object.assign(e,obj);else data.events.push(obj);selected=start;month=new Date(parseDate(start).getFullYear(),parseDate(start).getMonth(),1);persist();closeModal();render();notify(e?'일정이 수정되었습니다.':'새 일정이 등록되었습니다.')}}
function openTeams(){modal(`<div class="modal-header"><h2 id="modalTitle">팀 관리</h2><button class="close" id="modalClose">×</button></div><div class="form-content"><p class="help-text">팀 이름을 변경하거나 새 팀을 추가할 수 있습니다. 팀 삭제 시 해당 팀의 일정도 함께 삭제됩니다.</p><div id="teamEditor"></div><form id="addTeamForm" style="display:flex;gap:8px;margin-top:16px"><input id="newTeamName" placeholder="새 팀 이름" maxlength="60" required style="min-width:0;flex:1;padding:10px;border:1px solid #e2e6f0;border-radius:9px"><button class="btn primary" type="submit">＋ 팀 추가</button></form></div>`);function draw(){const el=$('teamEditor');el.innerHTML=data.teams.map(t=>`<div style="display:flex;gap:8px;align-items:center;padding:9px 0;border-bottom:1px solid #eff1f6"><input type="color" data-color="${safe(t.id)}" value="${t.color}" aria-label="${safe(t.name)} 색상" style="width:32px;height:34px;border:0;background:transparent;padding:0"><input data-name="${safe(t.id)}" value="${safe(t.name)}" maxlength="60" aria-label="팀 이름" style="min-width:0;flex:1;padding:9px;border:1px solid #e2e6f0;border-radius:8px"><button class="btn danger" data-remove="${safe(t.id)}" style="padding:7px">삭제</button></div>`).join('');el.querySelectorAll('[data-name]').forEach(input=>input.addEventListener('change',()=>{const t=team(input.dataset.name);const v=input.value.trim();if(!v){input.value=t.name;return}t.name=v;persist();render();notify('팀 이름이 변경되었습니다.')}));el.querySelectorAll('[data-color]').forEach(input=>input.addEventListener('change',()=>{team(input.dataset.color).color=input.value;persist();render()}));el.querySelectorAll('[data-remove]').forEach(btn=>btn.addEventListener('click',()=>{const t=team(btn.dataset.remove);const n=data.events.filter(e=>e.teamId===t.id).length;if(!confirm(`'${t.name}' 팀을 삭제하시겠습니까? 해당 팀 일정 ${n}개도 삭제됩니다.`))return;data.teams=data.teams.filter(x=>x.id!==t.id);data.events=data.events.filter(x=>x.teamId!==t.id);selectedTeams.delete(t.id);persist();draw();render();notify('팀을 삭제했습니다.')}))}draw();$('addTeamForm').onsubmit=e=>{e.preventDefault();const name=$('newTeamName').value.trim();if(!name)return;if(data.teams.length>=100)return notify('팀은 최대 100개까지 만들 수 있습니다.');const t={id:id(),name,color:colors[data.teams.length%colors.length]};data.teams.push(t);selectedTeams.add(t.id);$('newTeamName').value='';persist();draw();render();notify('새 팀을 추가했습니다.')}}
$('prevMonth').onclick=()=>{month=new Date(month.getFullYear(),month.getMonth()-1,1);render()};$('nextMonth').onclick=()=>{month=new Date(month.getFullYear(),month.getMonth()+1,1);render()};function jumpToday(){const n=new Date();month=new Date(n.getFullYear(),n.getMonth(),1);selected=fmt(n);render()}$('todayBtn').onclick=jumpToday;$('navToday').onclick=jumpToday;$('navCalendar').onclick=()=>{view='month';render()};$('addBtn').onclick=()=>openEvent();$('addSelected').onclick=()=>openEvent();$('monthView').onclick=()=>{view='month';render()};$('listView').onclick=()=>{view='list';render()};$('search').oninput=e=>{search=e.target.value.trim().toLocaleLowerCase();render()};$('teamFilters').onchange=e=>{if(!e.target.matches('[data-team]'))return;const t=e.target.dataset.team;if(e.target.checked)selectedTeams.add(t);else selectedTeams.delete(t);render()};$('selectAll').onclick=()=>{selectedTeams=new Set(data.teams.map(t=>t.id));render()};$('mobileTeam').onchange=e=>{selectedTeams=e.target.value==='all'?new Set(data.teams.map(t=>t.id)):new Set([e.target.value]);render()};$('manageTeams').onclick=openTeams;
$('calendarGrid').onclick=e=>{const ev=e.target.closest('[data-event]');if(ev){openEvent(ev.dataset.event);return}const cell=e.target.closest('[data-day]');if(cell){selected=cell.dataset.day;const d=parseDate(selected);if(d.getMonth()!==month.getMonth()||d.getFullYear()!==month.getFullYear())month=new Date(d.getFullYear(),d.getMonth(),1);render()}};$('calendarGrid').onkeydown=e=>{if((e.key==='Enter'||e.key===' ')&&e.target.matches('[data-day]')){e.preventDefault();e.target.click()}};$('dayAgenda').onclick=e=>{const b=e.target.closest('[data-event]');if(b)openEvent(b.dataset.event)};$('fullAgenda').onclick=e=>{const b=e.target.closest('[data-event]');if(b)openEvent(b.dataset.event)};document.addEventListener('keydown',e=>{if(e.key==='Escape')closeModal()});
$('exportBtn').onclick=()=>{const blob=new Blob([JSON.stringify({format:'teamflow',version:1,exportedAt:new Date().toISOString(),teams:data.teams,events:data.events},null,2)],{type:'application/json'});const url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download=`teamflow_${fmt(new Date())}.json`;document.body.append(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),1000);notify('일정 파일을 내려받았습니다.')};$('importBtn').onclick=()=>$('fileInput').click();$('fileInput').onchange=async e=>{const file=e.target.files?.[0];e.target.value='';if(!file)return;if(file.size>4*1024*1024)return notify('4MB 이하 파일만 가져올 수 있습니다.');try{const obj=JSON.parse(await file.text());if(obj.format!=='teamflow')throw Error('TeamFlow에서 내보낸 JSON 파일만 가져올 수 있습니다.');const next=validateData(obj);if(!confirm(`가져온 팀 ${next.teams.length}개, 일정 ${next.events.length}개로 현재 데이터를 교체하시겠습니까? 기존 일정은 사라집니다.`))return;data=next;selectedTeams=new Set(data.teams.map(t=>t.id));persist();render();notify('일정을 성공적으로 가져왔습니다.')}catch(err){notify('가져오기 실패: '+(err.message||'파일을 확인해주세요.'))}};
render();if(!localStorage.getItem(KEY))persist();
})();
